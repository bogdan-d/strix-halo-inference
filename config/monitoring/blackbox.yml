modules:
  gufo_ready:
    prober: http
    timeout: 2s
    http:
      method: GET
      valid_status_codes: [200]
      follow_redirects: false
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      body_size_limit: 4KB
      fail_if_body_json_not_matches_cel: "body.status == 'ready'"
  strixite_ready:
    prober: http
    timeout: 2s
    http:
      method: GET
      valid_status_codes: [200]
      follow_redirects: false
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      body_size_limit: 4KB
      fail_if_body_json_not_matches_cel: "body.status == 'ok'"
