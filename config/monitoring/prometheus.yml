global:
  # Keep SCRAPE in dashboard.html equal to this interval.
  scrape_interval: 2s
  scrape_timeout: 2s
  evaluation_interval: 15s

scrape_configs:
  - job_name: host
    static_configs:
      - targets: ['127.0.0.1:9100']
    sample_limit: 5000

  - job_name: halogen
    metrics_path: /metrics
    static_configs:
      - targets: ['127.0.0.1:8731']
    sample_limit: 100
    # Persist only verified aggregate metrics, never publisher-added content labels.
    metric_relabel_configs:
      - source_labels: [__name__]
        action: keep
        regex: 'llamacpp:(prompt_tokens_total|prompt_seconds_total|tokens_predicted_total|tokens_predicted_seconds_total|requests_processing|requests_deferred|kv_cache_tokens|kv_cache_usage_ratio)|halogen:(requests_total|prompt_tokens_cached_total|draft_tokens_total|draft_tokens_accepted_total|kv_pool_positions|kv_pool_reserved_tokens|cache_stats_age_seconds|cache_hits_total|cache_misses_total|cache_prompt_tokens_saved_total|cache_entries|cache_bytes|cache_evicted_total|cache_disk_enabled|cache_disk_bytes|cache_disk_budget_bytes|cache_disk_hits_total|kv_pool_waiting_for_room|engine_up|busy_for_seconds|queue_wait_longest_seconds|queue_gave_up_total|gpu_queues_evicted_seconds_total)'
      - action: labelkeep
        regex: '__name__|job|instance'

  - job_name: strixite
    metrics_path: /metrics
    static_configs:
      - targets: ['127.0.0.1:5300']
    sample_limit: 100
    metric_relabel_configs:
      - source_labels: [__name__]
        action: keep
        regex: 'strix_(requests_total|prompt_tokens_total|prompt_tokens_cached_total|prefill_tokens_total|generated_tokens_total|cache_hits_total|cache_misses_total|mtp_drafted_tokens_total|mtp_accepted_tokens_total|last_prefill_tokens_per_second|last_decode_tokens_per_second|queue_depth|busy|live_tokens|context_length|ngram_rows_unique_total|ngram_rows_cached_total|ngram_rows_read_total|ngram_rows_prefetched_total|ple_wait_seconds_total|ple_wait_max_seconds|prompt_cache_entries|prompt_cache_bytes|prompt_cache_ram_entries|prompt_cache_ram_bytes|prompt_cache_spare_bytes|prompt_cache_ram_evicted_total|prompt_cache_ram_only_dropped_total|prompt_cache_room_refused_total|prompt_cache_writes_total|prompt_cache_bytes_written_total|prompt_cache_rejected_total|prompt_cache_loads_total)'
      # Preserve only reviewed, bounded dimensions. Do not collapse labeled counters.
      - source_labels: [__name__, outcome]
        action: keep
        regex: 'strix_requests_total;(ok|error|cancelled)|strix_[^;]+;'
      - source_labels: [__name__, reason]
        action: keep
        regex: 'strix_prompt_cache_rejected_total;(space|budget|queue)|strix_[^;]+;'
      - action: labelkeep
        regex: '__name__|job|instance|outcome|reason'

  - job_name: strixite-ready
    metrics_path: /probe
    params:
      module: [strixite_ready]
      target: ['http://127.0.0.1:5300/health']
    static_configs:
      - targets: ['127.0.0.1:9115']
    sample_limit: 10
    metric_relabel_configs:
      - source_labels: [__name__]
        action: keep
        regex: 'probe_success|probe_duration_seconds|probe_http_status_code'
      - action: labelkeep
        regex: '__name__|job|instance'

  # bin/dashboard.py, which answers only while Halogen serves NPU models. Keep the port equal to DASHBOARD_PORT.
  - job_name: npu
    metrics_path: /metrics
    static_configs:
      - targets: ['127.0.0.1:9099']
    sample_limit: 30
    metric_relabel_configs:
      - source_labels: [__name__]
        action: keep
        regex: 'npu_(busy_percent|power_watts|model_loaded|queued)'
      - action: labelkeep
        regex: '__name__|job|instance|model'

  - job_name: gufo
    metrics_path: /metrics
    static_configs:
      - targets: ['127.0.0.1:8080']
    sample_limit: 100
    metric_relabel_configs:
      - source_labels: [__name__]
        action: keep
        regex: 'gufo_device_lost_total|llamacpp:(prompt_tokens_total|prompt_tokens_cached_total|prompt_seconds_total|tokens_predicted_total|tokens_predicted_seconds_total|n_tokens_max|spec_decode_num_drafts_total|spec_decode_num_draft_tokens_total|spec_decode_num_accepted_tokens_total|prompt_tokens_seconds|predicted_tokens_seconds|requests_processing|requests_deferred|kv_cache_usage_ratio)'
      - action: labelkeep
        regex: '__name__|job|instance'

  - job_name: gufo-ready
    metrics_path: /probe
    params:
      module: [gufo_ready]
      target: ['http://127.0.0.1:8080/ready']
    static_configs:
      - targets: ['127.0.0.1:9115']
    sample_limit: 10
    metric_relabel_configs:
      - source_labels: [__name__]
        action: keep
        regex: 'probe_success|probe_duration_seconds|probe_http_status_code'
      - action: labelkeep
        regex: '__name__|job|instance'
