[package]
name = "inference-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.100"
publish = false

[features]
default = ["tauri/custom-protocol"]
agent-debug = []

[build-dependencies]
tauri-build = "=2.7.5"

[dependencies]
tauri = { version = "=2.12.6", features = ["devtools"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["process", "time", "io-util", "sync", "macros"] }
gtk = "=0.18.2"
libc = "=0.2.191"
webkit2gtk = { version = "=2.0.2", features = ["v2_40"] }

[profile.dev]
debug = 0
incremental = false

[profile.dev.package.inference-desktop]
debug = 2
